  <text x="112" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="url(#goldGrad)" letter-spacing="4">AL</text>
  <text x="190" y="85" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="4">JOURNEY</text>
